<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Bunkasai</title>
  <!-- ① スクリプトの読み込み -->
<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<script>
            AFRAME.registerComponent('hit-box', {
                init:function(){
                    this.el.addEventListener('click', ()=>{
                const el = this.el;

                // 1. 連打防止：当たり判定のクラスを一時的に削除
                el.classList.remove('raycastable');
                console.log(el.id + '：判定を消去、アニメーション開始');

                // 2. アニメーションを動的に追加（例：Y軸を中心に1秒で1回転）
                el.setAttribute('animation', {
                    property: 'rotation',
                    to: '0 360 0',
                    dur: 1000,
                    easing: 'easeOutQuad'
                });

                // 3. アニメーション終了（1000ミリ秒後）に元の状態に戻す
                setTimeout(() => {
                    // アニメーション属性を削除し、角度を元に戻す
                    el.removeAttribute('animation');
                    el.setAttribute('rotation', '0 0 0');

                    // 当たり判定のクラスを再び追加して元に戻す
                    el.classList.add('raycastable');
                    console.log(el.id + '：元の状態に戻りました');
                }, 1000);
                    });
                }
            });
        </script>
  
</head>

<body style='margin: 0; overflow: hidden;'>

<!-- シーンの追加とデバックUIを非表示 -->
  <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
<a-assets><a-asset-item id="bouningen" src="model/yarakasita.glb"></a-asset-item></a-assets>
   
<a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .raycastable"></a-entity>

   
    
    <a-marker preset="hiro">
   <a-entity position="0 1.6 -1">
                <!-- 3Dモデル -->
                
                
   <a-entity position="0 -0.05 0" hit-box>
                    <a-entity class="raycastable" geometry="primitive:cylinder" material="color:red; opacity: 0.5" scale="0.2 0.2 0.2" position="0 0.1 0" visible="true"></a-entity>
                    <a-entity class="raycastable" geometry="primitive:box" material="color:blue; opacity: 0.5" scale="0.2 0.25 0.1" position="0 0 0.1" visible="true"></a-entity>
                </a-entity>
            </a-entity>
            
    </a-marker>

  <a-entity camera> </a-entity>
    </a-scene>
</a-scene>
</body>
  
</html>
