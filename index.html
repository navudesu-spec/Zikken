<!DOCTYPE html>
<head>
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Bunkasai</title>
  <!-- ① スクリプトの読み込み -->
<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3/dist/jquery.min.js"></script>
  <script>
AFRAME.registerComponent('hit-box', {
  init: function () {

    const scene = document.querySelector("a-scene");
    const raycasterEl = document.querySelector("[raycaster]");
    const targetEl = this.el.querySelector('.raycastable'); 
    this.el.addEventListener('click', () => {
      
        if (targetEl) {
          targetEl.setAttribute("visible", false);
        }
      if (raycasterEl) {
        raycasterEl.setAttribute("raycaster", "enabled", false);
      }
  const markerEl = this.el.closest('a-marker');
        let touchModel = null;
        if (markerEl) {
          touchModel = markerEl.querySelector('[gltf-model="#touch"]');}
          if (touchModel) {
            touchModel.setAttribute('visible', false);
          }
        
      
      if (touchModel){touchModel.setAttribute('visible', false);}


      
      const random = Math.floor(Math.random() * 100) + 1;
      const model = document.createElement("a-entity");
   
      model.setAttribute("gltf-model", "#tresure");
        model.setAttribute("position", "0 0 0"); 
        model.setAttribute("scale", "1 1 1"); 
        model.setAttribute("rotation", "-90 270 90");
        model.setAttribute('animation-mixer', {
  clip: 'akeru',
  loop: 'once',
  timeScale: 1,
  clampWhenFinished: true    
});
    
  if (markerEl) {
          markerEl.appendChild(model); }
    
    setTimeout(() => {
         let rewardmodel = null;
      if (model && model.parentNode) {
            model.parentNode.removeChild(model);}
     rewardmodel = document.createElement("a-entity");
      if (random>=90)
      {rewardmodel.setAttribute("gltf-model", "#utiwa");
        rewardmodel.setAttribute("position", "3 0 0"); 
        rewardmodel.setAttribute("scale", "0.5 0.5 0.5"); 
        rewardmodel.setAttribute("rotation", "-90 270 90");}
      else if(random>=50)
      {rewardmodel.setAttribute("gltf-model", "#taimatu");
       rewardmodel.setAttribute("position", "0 0 5"); 
       rewardmodel.setAttribute("scale", "0.5 0.5 0.5"); 
       rewardmodel.setAttribute("rotation", "-90 270 90");}
       else if(random>=10)
      {rewardmodel.setAttribute("gltf-model", "#yari");
       rewardmodel.setAttribute("position", "0 0 5"); 
         rewardmodel.setAttribute("scale", "0.5 0.5 0.5"); 
       rewardmodel.setAttribute("rotation", "-90 270 90");}
          else 
       {rewardmodel.setAttribute("gltf-model", "#kne");
       rewardmodel.setAttribute("position", "0 0 5"); 
       rewardmodel.setAttribute("scale", "0.5 0.5 0.5"); 
        rewardmodel.setAttribute("rotation", "-90 270 90");}
        
      if (markerEl) {
        markerEl.appendChild(rewardmodel);
      }
     }, 3000);
     
    
    

        
           
      setTimeout(() => {
           if (model && model.parentNode) {
          rewardmodel.parentNode.removeChild(rewardmodel);}
        this.el.setAttribute("visible", true);
        if (raycasterEl) {
          raycasterEl.setAttribute("raycaster", "enabled", true);
        }
        if (targetEl) {
          targetEl.setAttribute("visible", true); }
          if (touchModel) {
          touchModel.setAttribute('visible', true); 
        }
      }, 6000); 
    });
  }
});
</script>


  
</head>

<body style='margin: 0; overflow: hidden;'>

<!-- シーンの追加とデバックUIを非表示 -->
  <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false; ">
<a-assets>
  <a-asset-item id="kne" src="model/kne.glb"></a-asset-item>
    <a-asset-item id="taimatu" src="model/taimatu.glb"></a-asset-item>
    <a-asset-item id="tresure" src="model/tresure.glb"></a-asset-item>
    <a-asset-item id="utiwa" src="model/utiwa.glb"></a-asset-item>
    <a-asset-item id="yari" src="model/yari.glb"></a-asset-item>
    <a-asset-item id="bouningen" src="model/yarakasita.glb"></a-asset-item>
<a-asset-item id="koumorimodoki" src="model/koumorimodoki.glb"></a-asset-item>
  <a-asset-item id="touch" src="model/touch.glb"></a-asset-item></a-assets>
  
<a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .raycastable"></a-entity>

   
     <a-marker preset="hiro">
        <!-- 3Dモデルを呼び出す -->
        <a-entity gltf-model="#touch" rotation="0 270 90" class="default-model"></a-entity>

            <a-entity position="0 0 3" hit-box>
                    <a-entity class="raycastable" geometry="primitive:box" material="color:red; opacity: 0.5" scale="3 4 4" position="0 0 -4.5" visible="true"></a-entity>
                </a-entity>
        </a-marker>
           
   
<a-marker type="pattern" url="GAzou/pattern-sword.patt">
    <a-entity position="0 1.6 0">
                <!-- 3Dモデル -->
    
   <a-entity position="0 -0.05 0" hit-box>
                    <a-entity class="raycastable" geometry="primitive:box" material="color:red; opacity: 0.5" scale="1 1 1" position="0 0.1 0" visible="true" data-type="atari-hantei-1"></a-entity>
                </a-entity>
      <a-entity gltf-model="#bouningen" scale="0.5 0.5 0.5" rotation="180 0 0"></a-entity>
            </a-entity>
       </a-marker>
<a-marker type="pattern" url="GAzou/pattern-untitled.patt">
    <a-entity position="0 1.6 0">
                <!-- 3Dモデル -->
    
   <a-entity position="0 -0.05 0" hit-box>
                    <a-entity class="raycastable" geometry="primitive:box" material="color:red; opacity: 0.5" scale="1 1 1" position="0 0.1 0" visible="true" data-type="atari-hantei-1"></a-entity>
                </a-entity>
      <a-entity gltf-model="#bouningen" scale="0.5 0.5 0.5" rotation="180 0 0"></a-entity>
            </a-entity>     
</a-marker>
  <a-entity camera> </a-entity>
   
</a-scene>
</body>
  
</html>
