<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Bunkasai</title>
  <!-- ① スクリプトの読み込み -->
<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<script>
       AFRAME.registerComponent('hit-box', {
        init:function(){
          this.el.addEventListener('click', ()=>{
            const scene = document.querySelector("a-scene");
            const raycasterEl = document.querySelector("[raycaster]");
            raycasterEl.setAttribute("raycaster", "enabled", false);
            this.el.setAttribute("visible", false);
            
            random= Math.floor( Math.random()*3)+1;
            
            if (random==1)
                {const box = document.createElement("a-box");
                             box.setAttribute("color", "red");
                             box.setAttribute("position", "0 1 -3");
                             scene.appendChild(box);
             box.setAttribute("animation__rotation", {
                property: "rotation",      // 変化させるプロパティ
                to: "0 360 0",             // 0度から360度まで回転
                dur: 3000,                 // 3秒（3000ミリ秒）かけて動く
                easing: "linear",          // 一定の速度で
                loop: true                 // ループ再生（無限に回る）
                 });
                 setTimeout(() => 
                {if (box && box.parentNode) {
                    box.parentNode.removeChild(box);}
                 }, 3000); }
            
            else if (random==2)
                {const box = document.createElement("a-box");
                             box.setAttribute("color", "blue");
                             box.setAttribute("position", "0 1 -3");
                             scene.appendChild(box);
                box.setAttribute("animation__rotation", {
                property: "rotation",      // 変化させるプロパティ
                to: "0 360 0",             // 0度から360度まで回転
                dur: 3000,                 // 3秒（3000ミリ秒）かけて動く
                easing: "linear",          // 一定の速度で
                loop: true                 // ループ再生（無限に回る）
                 });
                setTimeout(() => {
                if (box && box.parentNode) 
                {box.parentNode.removeChild(box);}
                }, 3000); 
                }
           
            else 
                  {const box = document.createElement("a-box");
                             box.setAttribute("color", "purple");
                             box.setAttribute("position", "0 1 -3");
                             scene.appendChild(box);
                   box.setAttribute("animation__rotation", {
                property: "rotation",      // 変化させるプロパティ
                to: "0 360 0",             // 0度から360度まで回転
                dur: 3000,                 // 3秒（3000ミリ秒）かけて動く
                easing: "linear",          // 一定の速度で
                loop: true                 // ループ再生（無限に回る）
                 });
                setTimeout(() => {
                if (box && box.parentNode) 
                {box.parentNode.removeChild(box);}
                }, 3000); 
                }
            
            setTimeout(() => {this.el.setAttribute("visible", true);}, 3500); 
    
                    });
                }
            });
            setTimeout(() => {
                raycasterEl.setAttribute("raycaster", "enabled", true);}, 3500); 

  });
    }
        </script>
  
</head>

<body style='margin: 0; overflow: hidden;'>

<!-- シーンの追加とデバックUIを非表示 -->
  <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
<a-assets><a-asset-item id="bouningen" src="model/yarakasita.glb"></a-asset-item></a-assets>
   
<a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .raycastable"></a-entity>

   
    
    <a-marker preset="hiro">
   <a-entity position="0 1.6 0">
                <!-- 3Dモデル -->
    
   <a-entity position="0 -0.05 0" hit-box>
                    <a-entity class="raycastable" geometry="primitive:cylinder" material="color:red; opacity: 0.5" scale="0.5 0.5 0.5" position="0 0.1 0" visible="true" data-type="atari-hantei"></a-entity>
                    <a-entity class="raycastable" geometry="primitive:box" material="color:blue; opacity: 0.5" scale="0.2 0.25 0.1" position="0 0 0.1" visible="true"></a-entity>
                </a-entity>
            </a-entity>
            
    </a-marker>
<a-marker type="pattern" url="">
    <a-entity position="0 1.6 0">
                <!-- 3Dモデル -->
    
   <a-entity position="0 -0.05 0" hit-box>
                    <a-entity class="raycastable" geometry="primitive:cylinder" material="color:red; opacity: 0.5" scale="0.5 0.5 0.5" position="0 0.1 0" visible="true" data-type="atari-hantei"></a-entity>
                    <a-entity class="raycastable" geometry="primitive:box" material="color:blue; opacity: 0.5" scale="0.2 0.25 0.1" position="0 0 0.1" visible="true"></a-entity>
                </a-entity>
            </a-entity>
            
</a-marker>
  <a-entity camera> </a-entity>
    
</a-scene>
</body>
  
</html>
