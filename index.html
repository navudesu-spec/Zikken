<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Bunkasai</title>
  <!-- ① スクリプトの読み込み -->
<script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
<script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.2/aframe/build/aframe-ar.js"></script>

</head>
<body style='margin: 0; overflow: hidden;'>

<!-- シーンの追加とデバックUIを非表示 -->
 <a-scene embedded arjs="sourceType: webcam; debugUIEnabled:false;">
<a-assets><a-asset-item id="bouningen" src="model/yarakasita.glb"></a-asset-item></a-assets>
  <a-camera gps-camera rotation-reader></a-camera>
        <a-entity scale="10 10 10" position="0 0.4 -3" gltf-model="#bouningen" visible="true">
        </a-entity>

        <a-light type="ambient" color="#ffffff"></a-light>
        <a-light type="point" intensity="2" position="0 4 0"></a-light>
</a-scene>
</body>
</html>
