<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Bunkasai</title>
  <!-- ① スクリプトの読み込み -->
<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<script>
AFRAME.registerComponent('hit-box', {
  init: function () {

    const scene = document.querySelector("a-scene");
    const raycasterEl = document.querySelector("[raycaster]");
    const targetEl = this.el.querySelector('.raycastable');

    
    this.el.addEventListener('click', () => {
 
      targetEl.setAttribute("visible", false);
      if (raycasterEl) {
        raycasterEl.setAttribute("raycaster", "enabled", false);
      }
  
       const random = Math.floor(Math.random() * 2) + 1;

      const model = document.createElement("a-entity");
      if (random==1)
       {model.setAttribute("gltf-model", "#bouningen");
        model.setAttribute("position", "0 0.1 0"); 
        model.setAttribute("scale", "0.5 0.5 0.5"); 
        model.setAttribute("rotation", "0 90 90"); }
      else
      {model.setAttribute("gltf-model", "#koumorimodoki");
       model.setAttribute("position", "0 0.1 0"); 
       model.setAttribute("scale", "1 1 1"); }
   const markerEl = this.el.closest('a-marker');
      if (markerEl) {
        markerEl.appendChild(model);
      }
   setTimeout(() => {
          if (model && model.parentNode) {
            model.parentNode.removeChild(model);
          }},3000);
      
      setTimeout(() => {
        this.el.setAttribute("visible", true);
        if (raycasterEl) {
          raycasterEl.setAttribute("raycaster", "enabled", true);
        }
        if (targetEl) {
          targetEl.setAttribute("visible", true); 
        }
      }, 3300);
      
    });
  }
});
</script>

  
</head>

<body style='margin: 0; overflow: hidden;'>

<!-- シーンの追加とデバックUIを非表示 -->
  <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false; ">
<a-assets>
  <a-asset-item id="bouningen" src="model/yarakasita.glb"></a-asset-item>
<a-asset-item id="koumorimodoki" src="model/koumorimodoki.glb"></a-asset-item>
  <a-asset-item id="touch" src="model/touch.glb"></a-asset-item></a-assets>
  
<a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .raycastable"></a-entity>

   
     <a-marker preset="hiro">
        <!-- 3Dモデルを呼び出す -->
        <a-entity gltf-model="#touch" rotation="180 0 0"></a-entity>

            <a-entity position="0  0" hit-box>
                    <a-entity class="raycastable" geometry="primitive:box" material="color:red; opacity: 0.5" scale="3 3 3" position="0 0 0" visible="true" dataType="atari-hantei-1"></a-entity>
                </a-entity>
        </a-sphere></a-marker>

    <a-marker type="pattern" url="Garoua/pattern-IMG_2238.patt">
   <a-entity position="0 1.6 0">
                <!-- 3Dモデル -->
    
   <a-entity position="0 -0.05 0" hit-box>  
                    <a-entity class="raycastable" geometry="primitive:box" material="color:red; opacity: 0.5" scale="0.5 0.5 0.5" position="0 0.1 0" visible="true" data-type="atari-hantei-1"></a-entity>
                </a-entity>
            </a-entity>
            
    </a-marker>
<a-marker type="pattern" url="Garoua/pattern-untitled50.patt">
    <a-entity position="0 1.6 0">
                <!-- 3Dモデル -->
    
   <a-entity position="0 -0.05 0" hit-box>
                    <a-entity class="raycastable" geometry="primitive:box" material="color:red; opacity: 0.5" scale="1 1 1" position="0 0.1 0" visible="true" data-type="atari-hantei-1"></a-entity>
                </a-entity>
      <a-entity gltf-model="#bouningen" scale="0.5 0.5 0.5" rotation="180 180 0"></a-entity>
            </a-entity>
       
     
</a-marker>
  <a-entity camera> </a-entity>
    
</a-scene>
</body>
  
</html>
